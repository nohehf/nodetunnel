[package]
name = "nodetunnel"
version.workspace = true
edition.workspace = true

[lib]
name = "nodetunnel"
crate-type = ["cdylib"]

[dependencies]
nodetunnel-core = { path = "../core" }
godot = { version = "0.4.3", features = ["api-4-2"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
paperudp = { git = "https://github.com/curtjs/paperudp.git" }
