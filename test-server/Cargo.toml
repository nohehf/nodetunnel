[package]
name = "nodetunnel-test-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webrtc = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
